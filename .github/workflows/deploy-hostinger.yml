# Publica o site na Hostinger via FTP a cada push na main.
# Configure em Settings > Secrets and variables > Actions:
#   FTP_SERVER    -> ex.: ftp.weslleylarroza.com.br  (hPanel > Arquivos > Contas FTP)
#   FTP_USERNAME  -> usuário FTP
#   FTP_PASSWORD  -> senha FTP
#   FTP_DIR       -> (opcional) pasta de destino, padrão ./public_html/
name: Deploy na Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração do FTP
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::Secrets de FTP não configurados (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). Deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Enviar arquivos por FTP
        if: steps.cfg.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            LICENSE
